name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Tesseract OCR
      run: |
        choco install tesseract -y --no-progress
        echo "C:\Program Files\Tesseract-OCR" >> $GITHUB_PATH

    - name: Verify Tesseract
      run: |
        if (Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe") {
            echo "Tesseract found at C:\Program Files\Tesseract-OCR"
            & "C:\Program Files\Tesseract-OCR\tesseract.exe" --version
        } else {
            echo "Tesseract NOT found in default path"
            exit 1
        }

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pyarmor

    - name: Obfuscate source code
      run: |
        # Obfuscate all Python source files (strips docstrings, renames internals)
        pyarmor gen --output obfuscated main.py
        pyarmor gen --output obfuscated/src src/config_manager.py src/ai_service.py src/ocr_service.py src/capture_service.py src/hotkey_service.py src/overlay_ui.py src/settings_ui.py src/protection.py src/__init__.py

    - name: Build with PyInstaller (obfuscated)
      run: |
        # Copy non-Python assets to obfuscated dir
        copy config.json obfuscated\config.json
        # Build from obfuscated source
        cd obfuscated
        pyinstaller ..\Examly.spec --clean

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WindowsHelper
        path: obfuscated/dist/WindowsHelper
